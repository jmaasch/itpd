# Figure: seconds per run and F1 of ITPD against the number of time-indexed variables
paper_item: "Figure: seconds per run and F1 of ITPD against the number of time-indexed variables"
description: >
  Linear-Gaussian data from nonstationary graphs with lag-1 edges and in-degree 2, 2000 observations, Fisher-z test,
  from 320 variables (20 series, 16 time steps) to 10000 (200 series, 50 time steps). ITPD, IAMB at the corrected
  level and Lasso run at every size: 10 graphs at 320 variables and 5 above, three timed repetitions up to 2000
  variables and one above (a run at 10000 variables takes up to two hours). The other methods are runs of
  main_setting.yaml (320 variables) and of scalability.yaml (1000 and 2000 variables). Seconds depend on the
  machine; F1 is on all targets.
alpha: 0.01
ci_test: fisherz
seed: 0
graph:
  generator: stepwise
  in_degree: 2
data:
  mechanism: linear_gaussian
  M: 2000
graphs: 0-4
methods:
  - {name: ITPD}
  - {name: IAMB, levels: [corrected]}
  - {name: Lasso}
settings:
  - {graph: {N: 20, T: 16}, graphs: 0-9, repeat: 3}
  - {graph: {N: [50, 100], T: 20}, repeat: 3}
  - graph: {N: 50, T: 100}
  - graph: {N: 100, T: 50}
  - graph: {N: 200, T: 50}
  - graph: {generator: standard, N: 20, T: 16, lag: 1, in_degree: 2, stationary: false}
    graphs: 0-19
    methods:
      - {name: IPaDL, levels: [corrected]}
      - {name: FullCI, levels: [corrected]}
      - {name: PCMCI, levels: [corrected], max_lag: 1}
      - {name: DF-PC, levels: [corrected], time_limit: 600}
  - graph: {N: [50, 100], T: 20}
    methods:
      - {name: PCMCI, levels: [corrected], max_lag: 1}
      - {name: DF-PC, levels: [corrected], time_limit: 12600}
scoring:
  view: edges
  targets: all
report:
  metrics: [seconds, f1, unique_per_candidate]
