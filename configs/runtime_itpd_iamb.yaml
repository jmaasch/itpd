paper_item: "Table: seconds per run of ITPD and IAMB"
description: >
  ITPD and IAMB at the corrected level with the Fisher-z test on linear-Gaussian data from nonstationary graphs with
  lag-1 edges: 20 series over 16 time steps (the graphs of the main setting) and 50 and 100 series over 20 time
  steps, in-degree 2 and 5, 500 and 2000 observations; 5 graphs per setting and three timed repetitions per graph
  (the table takes the median). Seconds depend on the machine; the counts of CI tests do not.
alpha: 0.01
ci_test: fisherz
seed: 0
settings:
  - graph: {generator: standard, N: 20, T: 16, lag: 1, in_degree: [2, 5], stationary: false}
  - graph: {generator: stepwise, N: [50, 100], T: 20, in_degree: [2, 5]}
data:
  mechanism: linear_gaussian
  M: [500, 2000]                  # the first M rows of one draw of 2000 rows
graphs: 0-4
repeat: 3
methods:
  - {name: ITPD}
  - {name: IAMB, levels: [corrected]}
scoring:
  view: edges
  targets: common
report:
  metrics: [seconds, unique_per_candidate]
