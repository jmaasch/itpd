paper_item: "Figure: mean F1 against the share of edges redrawn at each time step"
description: >
  Linear-Gaussian data of 20 series over 16 time steps with lag-1 edges. At every time step a share of the edge
  slots is redrawn; share 0 is a stationary graph. In-degree 2 with six shares and in-degree 5 with shares 0 and 1;
  500 and 2000 observations (the figure shows in-degree 2 with 2000); 20 graphs per setting; Fisher-z test.
  F1 on the common targets, every baseline at its better level, and the difference to ITPD paired by graph.
alpha: 0.01
ci_test: fisherz
seed: 0
graph:
  generator: redrawn_edges
  N: 20
  T: 16
settings:
  - graph: {in_degree: 2, share: [0, 0.05, 0.1, 0.25, 0.5, 1]}
  - graph: {in_degree: 5, share: [0, 1]}
data:
  mechanism: linear_gaussian
  M: [500, 2000]                  # the first M rows of one draw of 2000 rows
graphs: 0-19
methods:
  - {name: ITPD}
  - {name: IAMB, levels: [alpha, corrected]}
  - {name: IPaDL, levels: [alpha, corrected]}
  - {name: FullCI, levels: [alpha, corrected]}
  - {name: Lasso}
  - {name: PCMCI, levels: [alpha, corrected], max_lag: 1}
  - {name: DF-PC, levels: [alpha, corrected], time_limit: 1800}
  - {name: DYNOTEARS, max_lag: 1}
  - {name: CD-NOD, levels: [alpha, corrected], max_lag: 1, time_limit: 1800}
scoring:
  view: edges
  targets: common
report:
  metrics: [f1]
  bootstrap: {resamples: 10000, seed: 20261113}
  relative_to: ITPD
