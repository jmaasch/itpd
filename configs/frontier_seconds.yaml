paper_item: "Figure: mean F1 against wall-clock time in the main setting (Pareto frontier)"
description: >
  The runs of main_setting_f1.yaml with 500 observations at in-degree 2 and 5. A point of the figure is the
  mean F1 and the mean seconds of one method. Seconds depend on the machine: only F1 has expected means.
alpha: 0.01
ci_test: fisherz
seed: 0
graph:
  generator: standard
  N: 20
  T: 16
  lag: 1
  in_degree: [2, 5]
  stationary: false
data:
  mechanism: linear_gaussian
  M: 500
graphs: 0-19
methods:
  - {name: ITPD}
  - {name: IAMB, levels: [alpha, corrected]}
  - {name: IPaDL, levels: [alpha, corrected]}
  - {name: FullCI, levels: [alpha, corrected]}
  - {name: Lasso}
  - {name: PCMCI, levels: [alpha, corrected], max_lag: 1}
  - {name: DF-PC, levels: [alpha, corrected], time_limit: 600}
  - {name: DYNOTEARS, max_lag: 1}
scoring:
  view: edges
  targets: common
report:
  metrics: [f1, seconds]
