[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itpd"
version = "0.2.0"
description = "Iterative Temporal Parent Discovery (ITPD): causal discovery for multivariate time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "networkx>=3.3", "pyyaml", "threadpoolctl"]

[project.optional-dependencies]
# matplotlib draws the graph in ITPD.plot_graph, which two tests call.
test = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run leaves out the tests marked slow. Run them with: python -m pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: stored runs that take up to 10 seconds each"]
