[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itpd"
version = "0.2.0"
description = "Iterative Temporal Parent Discovery (ITPD): causal discovery for multivariate time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "networkx>=3.3", "pyyaml"]

[project.optional-dependencies]
# matplotlib draws the graph in ITPD.plot_graph, which one test calls.
test = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: finite-data runs of several seconds each (deselect with -m 'not slow')"]
